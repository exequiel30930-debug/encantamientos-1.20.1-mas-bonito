name: Build mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: forge-1.20.1
            dir: forge-1.20.1
            java: '17'
            gradle: '8.1.1'
            args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: gradle build --no-daemon ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: SelectiveEnchantmentTransfer-${{ matrix.name }}
          path: ${{ matrix.dir }}/build/libs/*.jar
